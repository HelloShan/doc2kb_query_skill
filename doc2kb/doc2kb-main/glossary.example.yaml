# doc2kb 术语表示例
# ========================
# 把这个文件复制为项目根目录下的 glossary.yaml（和 config.py 里
# GLOSSARY_PATH 指向的位置一致）即可生效；不复制的话这个功能完全不启用，
# 不影响任何现有查询/入库流程。
#
# 用途：查询时如果问题里出现了下面列出的缩写/术语，会自动把 full/aliases
# 追加到问题后面一起去检索，缓解"问题里只写缩写、文档原文写的是全称"
# （或者反过来）导致语义/关键词都对不上的问题。
#
# 格式：
#   术语:
#     full: 全称
#     aliases: [其它别名1, 其它别名2]      # 可以留空 []
#
# 也支持精简写法（等价于 aliases: []）：
#   术语: 全称

KPI:
  full: 关键绩效指标
  aliases: [Key Performance Indicator]

ZTE:
  full: 中兴通讯
  aliases: []

# 精简写法示例
SLA: 服务级别协议
